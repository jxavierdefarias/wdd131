<script>
  // localStorage exigido pelo WDD131
  let total = parseInt(localStorage.getItem("orcamentosModelit")||"0")+1;
  localStorage.setItem("orcamentosModelit", total);
  document.addEventListener("DOMContentLoaded", ()=>{
    const el = document.getElementById("totalOrc");
    if(el) el.textContent = total;
