<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Solicite orçamento de cabides premium MODELIT para sua loja">
    <meta name="author" content="Jorge Farias">
    <title>Contato | AXFSTORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos2/projeto2.css">
    <script src="scripts/projeto2.js" defer></script>
</head>
<body>
<header>
    <h1>AXFSTORE</h1>
    <button id="menu" aria-label="Abrir menu">☰</button>
    <nav class="navegacao">
        <a href="home.html">Home</a>
        <a href="catalogo2.html">Catálogo</a>
        <a href="contato2.html" class="ativo">Contato</a>
    </nav>
</header>
<main>
  <div class="pagina-contato">
    <div class="texto-contato">
      <h2>Solicite seu Orçamento</h2>
      <p>Resposta em até 24h úteis. Informe quantidade e modelo.</p>
      <div class="info">Atendemos todo Brasil • Frete sob consulta</div>
    </div>

    <form method="get" action="agradecimento2.html" class="card form-contato">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" name="nome" required autocomplete="name">
        
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        
        <label for="tipo">Tipo de Negócio *</label>
        <select id="tipo" name="tipo" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="loja">Loja de Roupas</option>
            <option value="fabrica">Fábrica</option>
            <option value="atacado">Atacado</option>
            <option value="hotel">Hotel</option>
        </select>

        <fieldset>
            <legend>Interesse (pode marcar mais de um)</legend>
            <div class="check-group">
                <input type="checkbox" id="acrilico" name="interesse" value="acrilico">
                <label for="acrilico">Cabides Acrílico</label>
            </div>
            <div class="check-group">
                <input type="checkbox" id="veludo" name="interesse" value="veludo">
                <label for="veludo">Cabides Hotel</label>
            </div>
            <div class="check-group">
                <input type="checkbox" id="madeira" name="interesse" value="madeira">
                <label for="madeira">Cabides Madeira</label>
            </div>
        </fieldset>

        <label for="msg">Mensagem</label>
        <textarea id="msg" name="msg" rows="4" placeholder="Quantidade, modelo, prazo..."></textarea>
        
        <input type="submit" value="Solicitar Orçamento">
    </form>
  </div>
</main>
<footer>
    <p>&copy; <span id="currentyear"></span> AXFSTORE | WDD131 - Jorge Farias</p>

</footer>
