<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de avaliação de produtos MODELIT">
    <meta name="author" content="Seu Nome">
    <title>MODELIT - Avaliação de Produto</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>
<body>
    <header>
        <h1>MODELIT® - Fábrica de Cabides</h1>
        <p>Avaliação de Produto</p>
    </header>
    <main>
        <form method="get" action="avaliacao.html" class="card">
            <label for="produto">Nome do Produto *</label>
            <select id="produto" name="produto" required>
                <option value="" disabled selected>Selecione um Produto...</option>
            </select>

            <fieldset>
                <legend>Classificação Geral *</legend>
                <div class="rating">
                    <label><input type="radio" id="star5" name="avaliacao" value="5" required> 5 &starf;&starf;&starf;&starf;&starf;</label>
                    <label><input type="radio" id="star4" name="avaliacao" value="4" required> 4 &starf;&starf;&starf;&starf;</label>
                    <label><input type="radio" id="star3" name="avaliacao" value="3" required> 3 &starf;&starf;&starf;</label>
                    <label><input type="radio" id="star2" name="avaliacao" value="2" required> 2 &starf;&starf;</label>
                    <label><input type="radio" id="star1" name="avaliacao" value="1" required> 1 &starf;</label>
                </div>
            </fieldset>

            <label for="dataInstalacao">Data de Instalação *</label>
            <input type="date" id="dataInstalacao" name="dataInstalacao" required>

            <fieldset>
                <legend>Recursos Úteis (marque todos que se aplicam)</legend>
                <label class="check"><input type="checkbox" id="durabilidade" name="recursos" value="durabilidade"> Durabilidade</label>
                <label class="check"><input type="checkbox" id="design" name="recursos" value="design"> Design Elegante</label>
                <label class="check"><input type="checkbox" id="acabamento" name="recursos" value="acabamento"> Acabamento Premium</label>
                <label class="check"><input type="checkbox" id="personalizacao" name="recursos" value="personalizacao"> Personalização com Logo</label>
            </fieldset>

            <label for="avaliacaoTexto">Avaliação Escrita</label>
            <textarea id="avaliacaoTexto" name="avaliacaoTexto" rows="6" placeholder="Como foi sua experiência com o produto?"></textarea>

            <label for="nomeUsuario">Seu Nome</label>
            <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Opcional">

            <input type="submit" value="Enviar Avaliação">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> | MODELIT - Fábrica de Cabides | WDD 131 | BYU-Idaho</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
